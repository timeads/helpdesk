<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat preview</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f2ec; color: #2b2b2b; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #555; }
  code { background: #fff; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Chat preview</h1>
  <p>This is how the chat looks on your store. Click the bubble in the corner to try it. Chats you start here become real tickets in <b>Live chats</b>, so you can answer yourself from the other tab.</p>
  <p>It works here even while the chat is turned off in Settings, so you can test before it goes live.</p>
</main>
<script src="/chat/widget.js" data-preview="1" defer></script>
</body>
</html>
