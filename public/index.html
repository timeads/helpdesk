<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#213838">
  <title>Support · Tuft the World</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/chivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/chivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Your light/dark choice (Settings → Profile), before anything draws
    try { const t = localStorage.getItem("hd-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
<!--
THESIS: The store's own counter, not a SaaS dashboard. A three-pane helpdesk dressed in Tuft the World's shopfront, refusing the gray-on-white Zendesk default.
OWN-WORLD: Deep teal #213838 rail like the store top bar, ochre #c78c2b for the one primary action, brick #b03424 for danger, warm stone #cec6bf hairlines on white. Chivo for UI, Roboto for mail, Abril Fatface for the wordmark only. Order statuses in brand mint/ochre/brick.
STORY: Tim reads the email, sees the customer's real order beside it, replies, presses Send & close, and the next ticket is already open.
FIRST VIEWPORT: Teal rail left with queue counts; ticket list; conversation centered with the composer pinned at the bottom and Send & close in ochre; customer + orders column right.
FORM: Classic three-pane, list position 1; seed key f1f14ba4 (degraded roll).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
  <div id="app" class="booting"></div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
